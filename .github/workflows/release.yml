name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write # the "Version packages" commit
  pull-requests: write # the "Version packages" pull request
  id-token: write # npm trusted publishing (no stored token) and provenance

jobs:
  release:
    # Off until the packages exist on npm and trusted publishing is set up for this workflow; then set
    # the repository variable NPM_PUBLISH_ENABLED to true.
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:packages
      # Pending changesets → a "Version packages" pull request. Merging it (no changesets left, new versions) → publish.
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
